version: '3.8'

services:
  backend:
    build: .
    container_name: krishimitra-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=krishimitra_db
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:6.0
    container_name: krishimitra-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
